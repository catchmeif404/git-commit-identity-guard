name: Git identity check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          git config --local user.name catchmeif404
          git config --local user.email 325846367+catchmeif404@users.noreply.github.com
          node dist/index.js init
      - run: node dist/index.js check --phase push --json
